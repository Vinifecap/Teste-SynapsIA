<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SynapsIA — Diagnóstico à reabilitação conectando cérebro e movimento." />
    <meta name="theme-color" content="#0a0a14" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Instrument+Serif:ital@0;1&family=Sora:wght@200..800&display=swap" rel="stylesheet">
    <title>SynapsIA — Conectando Cérebro e Movimento</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Noise Overlay Global -->
    <svg class="pointer-events-none fixed inset-0 z-[9999] h-full w-full opacity-[0.05] mix-blend-overlay" style="min-height: 100vh;">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)"></rect>
    </svg>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
